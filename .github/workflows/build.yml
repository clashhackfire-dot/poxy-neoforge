name: Build mod jar

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      voxy_jar_url:
        description: "Direct download URL for the Voxy jar (compile-only, not redistributed)"
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Fetch Voxy jar (compile-only)
        env:
          VOXY_JAR_URL: ${{ inputs.voxy_jar_url || vars.VOXY_JAR_URL }}
        run: |
          mkdir -p libs
          if [ -z "$VOXY_JAR_URL" ]; then
            echo "::error::No Voxy jar URL provided. Set the VOXY_JAR_URL repo variable, or re-run this workflow with the voxy_jar_url input set to a direct .jar download link (e.g. from Modrinth)."
            exit 1
          fi
          curl -fL "$VOXY_JAR_URL" -o libs/voxy.jar
          echo "Downloaded voxy.jar ($(stat -c%s libs/voxy.jar) bytes)"

      - name: Build
        run: gradle build --no-daemon

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: poxy-neoforge-jar
          path: build/libs/*.jar
          if-no-files-found: error
